# Publishes the committed graphify outputs to GitHub Pages. The graph is built
# locally; this only deploys whatever is in graphify-out/.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "graphify-out/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Stage site
        run: |
          mkdir -p site
          cp graphify-out/graph.html site/index.html
          cp graphify-out/graph.json graphify-out/GRAPH_REPORT.md site/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
